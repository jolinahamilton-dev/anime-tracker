# Baut bei jedem Versions-Tag (z. B. v1.3.0) die PC-App, veröffentlicht sie als GitHub-Release und
# aktualisiert das Scoop-Manifest (bucket/anime-tracker.json) – darüber zeigt UniGetUI das Update an.
name: PC-App veröffentlichen

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bauen:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag passt zur Version in package.json?
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} passt nicht zu package.json ($v)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Clientschlüssel für die Google-Anmeldung (aus den Repository-Secrets)
        shell: pwsh
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:SECRET) { throw 'Secret GOOGLE_CLIENT_SECRET fehlt' }
          Set-Content src/main/geheim.local.ts "export const GOOGLE_CLIENT_SECRET = '$env:SECRET'"

      - name: Bauen
        run: npm run build

      - name: Installer und Zip erstellen
        run: npx electron-builder --win --publish never

      - name: Prüfsumme für Scoop
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash 'release/anime-tracker-${{ steps.version.outputs.version }}-win.zip' -Algorithm SHA256).Hash.ToLower()
          "hash=$h" >> $env:GITHUB_OUTPUT

      - name: GitHub-Release anlegen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # checkout holt den Tag ohne seine Nachricht – vollständig nachladen, damit --notes-from-tag die Änderungsliste nimmt
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          gh release create '${{ github.ref_name }}' "release/Anime-Tracker-Setup-$v.exe" "release/anime-tracker-$v-win.zip" `
            --title "Anime Tracker $v" --notes-from-tag

  scoop:
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Scoop-Manifest auf die neue Version setzen
        run: |
          v='${{ needs.bauen.outputs.version }}'
          jq --arg v "$v" --arg h '${{ needs.bauen.outputs.hash }}' \
            '.version = $v
             | .architecture."64bit".url = "https://github.com/jolinahamilton-dev/anime-tracker/releases/download/v\($v)/anime-tracker-\($v)-win.zip"
             | .architecture."64bit".hash = $h' bucket/anime-tracker.json > neu.json
          mv neu.json bucket/anime-tracker.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/anime-tracker.json
          git commit -m "Scoop: Anime Tracker $v" || echo 'Manifest unverändert'
          git push origin main
